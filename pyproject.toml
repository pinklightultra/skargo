[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "audiodrama"
version = "0.1.0"
description = "Screenplay-to-audio-drama pipeline: Fountain parsing, episode cutting, foley, TTS casts, music scoring, mixing and QA"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Justin Severn"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
edge = ["edge-tts", "miniaudio"]
mp3 = ["lameenc"]
all = ["edge-tts", "miniaudio", "lameenc"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
